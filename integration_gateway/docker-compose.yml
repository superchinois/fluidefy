services:
  redis:
    image: redis:8.8-alpine
    container_name: fluidefy-redis
    restart: unless-stopped
    ports:
      - "6373:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    container_name: fluidefy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluidefy
      POSTGRES_PASSWORD: fluidefy
      POSTGRES_DB: fluidefy_staging
    ports:
      - "5432:5432"
    volumes:
      - fluidefy_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluidefy -d fluidefy_staging"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: integration_gateway/Dockerfile
    container_name: fluidefy-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Inject all variables from .env at container creation (no rebuild needed).
    # Values in `environment` below take precedence over .env entries.
    env_file:
      - .env
    environment:
      # Compose-internal hostnames always win, even if .env points elsewhere.
      DATABASE_URL: postgresql://fluidefy:fluidefy@postgres:5432/fluidefy_staging
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: integration_gateway/Dockerfile
    container_name: fluidefy-worker
    restart: unless-stopped
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    # Inject all variables from .env at container creation (no rebuild needed).
    # Values in `environment` below take precedence over .env entries.
    env_file:
      - .env
    environment:
      # Compose-internal hostnames always win, even if .env points elsewhere.
      DATABASE_URL: postgresql://fluidefy:fluidefy@postgres:5432/fluidefy_staging
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  fluidefy_pgdata:
